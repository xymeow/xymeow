name: Update public contribution Minesweeper
on:
  schedule:
    - cron: '23 6 * * *'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: contribution-calendar
  cancel-in-progress: false
jobs:
  generate:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Test original generator
        run: node --test tools/contributions.test.mjs
      - name: Fetch verified public calendar and generate both themes
        env:
          GH_TOKEN: ${{ github.token }}
        run: node tools/contributions.mjs
      - name: Commit changed SVGs only
        run: |
          git add assets/minesweeper-contribution-graph.svg assets/minesweeper-contribution-graph-dark.svg
          if git diff --cached --quiet; then
            echo 'No calendar or animation changes.'
            exit 0
          fi
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'Update public contribution Minesweeper'
          git push origin HEAD:main
